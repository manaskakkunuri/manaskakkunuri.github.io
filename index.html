<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultron — Your AI Study Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12121c; --bg-elev:#1b1b29; --bg-elev2:#22222f;
    --text:#edeef4; --text-dim:#9a9ab0; --border:#2b2b3d;
    --accent:#f5b942; --accent-ink:#3a2a05;
    --accent2:#8b7bf7; --accent2-ink:#fff;
    --danger:#e0637a;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="light"]{
    --bg:#faf9f6; --bg-elev:#ffffff; --bg-elev2:#f1f0ec;
    --text:#191924; --text-dim:#6c6c80; --border:#e3e2db;
    --accent:#c9860f; --accent-ink:#fff;
    --accent2:#6a58e0; --accent2-ink:#fff;
  }
  html,body{height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent2); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important;}}

  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* Top bar */
  header.topbar{
    position:sticky; top:0; z-index:5;
    padding:calc(16px + env(safe-area-inset-top,0px)) 20px 14px;
    background:var(--bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#12121c; font-size:16px;
  }
  .brand-name{font-weight:800; font-size:19px; letter-spacing:-0.02em;}
  .topbar-actions{display:flex; gap:8px; align-items:center;}
  .icon-btn{
    width:36px; height:36px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg-elev); color:var(--text); font-size:16px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  select.lang-select{
    background:var(--bg-elev); color:var(--text); border:1px solid var(--border);
    border-radius:9px; padding:8px 10px; font-size:13px; font-weight:600; cursor:pointer;
  }

  main{flex:1; padding:20px 20px 100px;}

  /* Onboarding */
  .onboard-hero{margin-bottom:22px;}
  .onboard-hero h1{font-size:28px; line-height:1.15; margin:0 0 8px; letter-spacing:-0.02em;}
  .onboard-hero p{color:var(--text-dim); margin:0; font-size:15px; line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
  .field input{
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg-elev); color:var(--text); font-size:15px;
  }
  .field input:focus{border-color:var(--accent2);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .primary-btn{
    width:100%; padding:15px; border-radius:11px; border:none;
    background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:15px;
    cursor:pointer; margin-top:8px;
  }
  .ghost-btn{
    width:100%; padding:13px; border-radius:11px; border:1px solid var(--border);
    background:transparent; color:var(--text); font-weight:700; font-size:14px; cursor:pointer;
  }
  .hint{font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5;}

  /* Home */
  .greet{font-size:22px; font-weight:800; letter-spacing:-0.02em; margin:0 0 2px;}
  .greet-sub{color:var(--text-dim); font-size:14px; margin:0 0 20px;}
  .hero-card{
    background:linear-gradient(135deg,var(--accent2),#5d4cd6);
    border-radius:16px; padding:22px; color:#fff; margin-bottom:18px;
  }
  .hero-num{font-size:40px; font-weight:800; line-height:1;}
  .hero-label{font-size:13px; opacity:.85; margin-top:4px;}
  .plan-badge{
    display:inline-block; font-size:12px; font-weight:700; padding:4px 10px;
    border-radius:20px; margin-top:12px;
  }
  .plan-free{background:rgba(255,255,255,.18); color:#fff;}
  .plan-premium{background:var(--accent); color:var(--accent-ink);}

  .section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:22px 0 10px;}
  .action-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .action-card{
    background:var(--bg-elev); border:1px solid var(--border); border-radius:14px;
    padding:16px; text-align:left; cursor:pointer; color:var(--text);
  }
  .action-card .em{font-size:22px; display:block; margin-bottom:8px;}
  .action-card .t{font-weight:700; font-size:14px; margin-bottom:2px;}
  .action-card .d{font-size:12px; color:var(--text-dim); line-height:1.4;}

  .list-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 0; border-bottom:1px solid var(--border); font-size:14px;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .l{color:var(--text-dim);}
  .list-row .v{font-weight:700;}

  /* Focus mode */
  .upload-zone{
    border:1.5px dashed var(--border); border-radius:14px; padding:30px 18px;
    text-align:center; color:var(--text-dim); font-size:14px; margin-bottom:16px;
    background:var(--bg-elev);
  }
  .upload-zone input{display:none;}
  .upload-zone label{color:var(--accent2); font-weight:700; cursor:pointer;}
  .preview-img{width:100%; border-radius:12px; margin-bottom:14px; display:block;}
  .explain-card{
    background:var(--bg-elev); border:1px solid var(--border); border-left:3px solid var(--accent2);
    border-radius:12px; padding:16px; font-size:14px; line-height:1.6; margin-bottom:16px;
  }
  .explain-card b{color:var(--accent2);}

  /* Quiz */
  .quiz-progress{font-size:12px; color:var(--text-dim); font-weight:700; margin-bottom:10px;}
  .quiz-q{font-size:17px; font-weight:700; margin-bottom:16px; line-height:1.4;}
  .opt-btn{
    display:block; width:100%; text-align:left; padding:14px; border-radius:11px;
    border:1px solid var(--border); background:var(--bg-elev); color:var(--text);
    font-size:14px; margin-bottom:10px; cursor:pointer;
  }
  .opt-btn.correct{border-color:#57c08a; background:rgba(87,192,138,.12);}
  .opt-btn.wrong{border-color:var(--danger); background:rgba(224,99,122,.12);}
  .lock-card{
    background:var(--bg-elev); border:1px dashed var(--border); border-radius:14px;
    padding:20px; text-align:center; color:var(--text-dim); font-size:13px;
  }

  /* Bottom nav */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:5;
    background:var(--bg-elev); border-top:1px solid var(--border);
    padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .tabbar-inner{max-width:480px; margin:0 auto; display:flex; justify-content:space-around;}
  .tab-btn{
    background:none; border:none; color:var(--text-dim); font-size:11px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:4px 10px;
  }
  .tab-btn .em{font-size:19px;}
  .tab-btn.active{color:var(--accent2);}

  .empty-note{font-size:12px; color:var(--text-dim); text-align:center; margin-top:14px;}
</style>
</head>
<body>
<div id="app"></div>

    profile:"ప్రొఫైల్", details:"మీ వివరాలు", signOut:"సైన్ అవుట్", home:"హోమ్", focus:"ఫోకస్", quiz:"క్విజ్", you:"మీరు",

const QUIZ_SETS = {
  free: {topic:"Photosynthesis basics", qs:[
    {q:"What gas do plants absorb for photosynthesis?", opts:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"], correct:1},
    {q:"Where does photosynthesis mainly occur?", opts:["Roots","Chloroplast","Mitochondria","Nucleus"], correct:1},
    {q:"What is released as a byproduct?", opts:["Oxygen","Carbon dioxide","Water","Glucose only"], correct:0}
  ]},
  premium: {topic:"Photosynthesis — advanced", qs:[
    {q:"Which pigment absorbs light most efficiently?", opts:["Chlorophyll a","Carotene","Xanthophyll","Anthocyanin"], correct:0},
    {q:"Light-independent reactions occur in the:", opts:["Thylakoid","Stroma","Cell wall","Vacuole"], correct:1}
  ]}
};

let state = {
  profile: JSON.parse(localStorage.getItem(STORE_KEY) || 'null'),
  lang: localStorage.getItem(LANG_KEY) || 'en',
  screen: 'home',
  quiz: null
};
document.documentElement.setAttribute('data-theme', localStorage.getItem(THEME_KEY) || 'dark');

function t(k){ return STR[state.lang][k]; }
function isPremium(){ return state.profile && PREMIUM_EMAILS.includes((state.profile.email||'').trim().toLowerCase()); }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state.profile)); }
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
}
function setLang(l){ state.lang = l; localStorage.setItem(LANG_KEY, l); render(); }
function go(screen){ state.screen = screen; render(); }

function topbar(){
  const opts = ['en','hi','te'].map(l=>`<option value="${l}" ${state.lang===l?'selected':''}>${l==='en'?'EN':l==='hi'?'हिं':'తె'}</option>`).join('');
  return `<header class="topbar">
    <div class="brand"><div class="brand-mark">U</div><div class="brand-name">Ultron</div></div>
    <div class="topbar-actions">
      <select class="lang-select" onchange="setLang(this.value)">${opts}</select>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">${document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️'}</button>
    </div>
  </header>`;
}

function tabbar(){
  const tabs = [['home',t('home'),'🏠'],['focus',t('focus'),'📸'],['quiz',t('quiz'),'📝'],['profile',t('you'),'👤']];
  return `<nav class="tabbar"><div class="tabbar-inner">
    ${tabs.map(([id,label,em])=>`<button class="tab-btn ${state.screen===id?'active':''}" onclick="go('${id}')"><span class="em">${em}</span>${label}</button>`).join('')}
  </div></nav>`;
}

function renderOnboarding(){
  document.getElementById('app').innerHTML = `
    ${topbar()}
    <main>
      <div class="onboard-hero">
        <h1>${t('welcome')}</h1>
        <p>${t('welcomeSub')}</p>
      </div>
      <form onsubmit="submitOnboarding(event)">
        <div class="field"><label>${t('fullName')}</label><input required id="f_name"></div>
        <div class="row2">
          <div class="field"><label>${t('cls')}</label><input required id="f_class"></div>
          <div class="field"><label>${t('section')}</label><input required id="f_section"></div>
        </div>
        <div class="field"><label>${t('school')}</label><input required id="f_school"></div>
        <div class="row2">
          <div class="field"><label>${t('dob')}</label><input required type="date" id="f_dob"></div>
          <div class="field"><label>${t('age')}</label><input required type="number" min="3" max="25" id="f_age"></div>
        </div>
        <div class="field"><label>${t('email')}</label><input required type="email" id="f_email"></div>
        <button class="primary-btn" type="submit">${t('start')}</button>
      </form>
      <p class="hint">${t('offline')}</p>
    </main>`;
}
window.submitOnboarding = function(e){
  e.preventDefault();
  state.profile = {
    name: document.getElementById('f_name').value,
    cls: document.getElementById('f_class').value,
    section: document.getElementById('f_section').value,
    school: document.getElementById('f_school').value,
    dob: document.getElementById('f_dob').value,
    age: document.getElementById('f_age').value,
    email: document.getElementById('f_email').value
  };
  save();
  state.screen = 'home';
  render();
};

function renderHome(){
  const p = state.profile, premium = isPremium();
  document.getElementById('app').innerHTML = `
    ${topbar()}
    <main>
      <p class="greet">${t('hi')}, ${p.name.split(' ')[0]} 👋</p>
      <p class="greet-sub">${t('ready')}</p>
      <div class="hero-card">
        <div class="hero-num">1</div>
        <div class="hero-label">${t('streak')}</div>
        <span class="plan-badge ${premium?'plan-premium':'plan-free'}">${premium?t('premium'):t('free')}</span>
      </div>
      <p class="section-title">${t('quickActions')}</p>
      <div class="action-grid">
        <button class="action-card" onclick="go('focus')"><span class="em">📸</span><div class="t">${t('focusMode')}</div><div class="d">${t('focusDesc')}</div></button>
        <button class="action-card" onclick="go('quiz')"><span class="em">📝</span><div class="t">${t('quizMode')}</div><div class="d">${t('quizDesc')}</div></button>
        <button class="action-card" onclick="go('focus')"><span class="em">💬</span><div class="t">${t('askDoubt')}</div><div class="d">${t('askDesc')}</div></button>
        <button class="action-card" onclick="go('profile')"><span class="em">📅</span><div class="t">${t('update')}</div><div class="d">${t('updateNote')}</div></button>
      </div>
    </main>
    ${tabbar()}`;
}

function renderFocus(){
  document.getElementById('app').innerHTML = `
    ${topbar()}
    <main>
      <p class="greet">${t('focusMode')}</p>
      <p class="greet-sub">${t('focusDesc')}</p>
      <div class="upload-zone" id="uz">
        <div>${t('uploadTitle')}</div>
        <label for="fileIn">${t('uploadSub')}</label>
        <input type="file" id="fileIn" accept="image/*" onchange="handleUpload(event)">
      </div>
      <div id="focusResult"></div>
    </main>
    ${tabbar()}`;
}
window.handleUpload = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    document.getElementById('focusResult').innerHTML = `
      <img class="preview-img" src="${ev.target.result}" alt="Uploaded syllabus page">
      <div class="explain-card"><b>${QUIZ_SETS.free.topic}:</b> Photosynthesis is how plants turn sunlight, water and carbon dioxide into glucose and oxygen inside the chloroplast. Focus on the light and dark reactions — that split is a common exam question.<br><br>${t('demoNote')}</div>
      <button class="primary-btn" onclick="go('quiz')">${t('startQuiz')}</button>`;
  };
  reader.readAsDataURL(file);
};

function renderQuiz(){
  if(!state.quiz){
    state.quiz = {set:'free', i:0, score:0, done:false, picked:null};
  }
  const q = state.quiz;
  const set = QUIZ_SETS[q.set];
  let body;
  if(q.done){
    body = `<p class="quiz-q">${t('quizDone')} 🎉</p>
      <p style="font-size:15px; color:var(--text-dim); margin-bottom:20px;">${t('score')}: <b style="color:var(--text)">${q.score}/${set.qs.length}</b></p>
      <button class="ghost-btn" onclick="state.quiz=null; render();">${t('retry')}</button>
      ${!isPremium() ? `<div class="lock-card" style="margin-top:16px;">🔒 ${t('locked')}</div>` : `<button class="primary-btn" onclick="state.quiz={set:'premium',i:0,score:0,done:false,picked:null}; render();">${QUIZ_SETS.premium.topic}</button>`}`;
  } else {
    const cur = set.qs[q.i];
    body = `<p class="quiz-progress">${set.topic} · ${q.i+1}/${set.qs.length}</p>
      <p class="quiz-q">${cur.q}</p>
      ${cur.opts.map((o,idx)=>`<button class="opt-btn ${q.picked!==null ? (idx===cur.correct?'correct':(idx===q.picked?'wrong':'')) : ''}" ${q.picked!==null?'disabled':''} onclick="answerQuiz(${idx})">${o}</button>`).join('')}
      ${q.picked!==null ? `<button class="primary-btn" onclick="nextQuiz()">Next</button>` : ''}`;
  }
  document.getElementById('app').innerHTML = `${topbar()}<main>${body}</main>${tabbar()}`;
}
window.answerQuiz = function(idx){
  const q = state.quiz, set = QUIZ_SETS[q.set];
  q.picked = idx;
  if(idx === set.qs[q.i].correct) q.score++;
  render();
};
window.nextQuiz = function(){
  const q = state.quiz, set = QUIZ_SETS[q.set];
  q.i++; q.picked = null;
  if(q.i >= set.qs.length) q.done = true;
  render();
};

function renderProfile(){
  const p = state.profile, premium = isPremium();
  document.getElementById('app').innerHTML = `
    ${topbar()}
    <main>
      <p class="greet">${t('profile')}</p>
      <span class="plan-badge ${premium?'plan-premium':'plan-free'}" style="margin-bottom:16px;">${premium?t('premium'):t('free')}</span>
      <p class="section-title">${t('details')}</p>
      <div class="list-row"><span class="l">${t('fullName')}</span><span class="v">${p.name}</span></div>
      <div class="list-row"><span class="l">${t('cls')}</span><span class="v">${p.cls}</span></div>
      <div class="list-row"><span class="l">${t('section')}</span><span class="v">${p.section}</span></div>
      <div class="list-row"><span class="l">${t('school')}</span><span class="v">${p.school}</span></div>
      <div class="list-row"><span class="l">${t('dob')}</span><span class="v">${p.dob}</span></div>
      <div class="list-row"><span class="l">${t('age')}</span><span class="v">${p.age}</span></div>
      <div class="list-row"><span class="l">${t('email')}</span><span class="v">${p.email}</span></div>
      <div class="list-row"><span class="l">${t('lang')}</span><span class="v">${state.lang.toUpperCase()}</span></div>
      <div class="list-row"><span class="l">${t('update')}</span><span class="v">Sep 2026</span></div>
      <button class="ghost-btn" style="margin-top:22px;" onclick="signOut()">${t('signOut')}</button>
    </main>
    ${tabbar()}`;
}
window.signOut = function(){
  localStorage.removeItem(STORE_KEY);
  state.profile = null; state.screen = 'home'; state.quiz = null;
  render();
};

function render(){
  if(!state.profile){ renderOnboarding(); return; }
  if(state.screen==='focus') renderFocus();
  else if(state.screen==='quiz') renderQuiz();
  else if(state.screen==='profile') renderProfile();
  else renderHome();
}
render();
</script>
</body>
</html>
