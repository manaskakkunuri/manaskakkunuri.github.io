<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultron — Study Assistant</title>
<style>
:root{--bg:#f7f7fb;--panel:#fff;--text:#1a1a2e;--muted:#6b6b80;--accent:#6c5ce7;--border:#e3e3ef;--danger:#e74c3c;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12121c;--panel:#1c1c2b;--text:#eaeaf5;--muted:#9a9ab0;--accent:#8b7cf6;--border:#2c2c40;}}
:root[data-theme="dark"]{--bg:#12121c;--panel:#1c1c2b;--text:#eaeaf5;--muted:#9a9ab0;--accent:#8b7cf6;--border:#2c2c40;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{position:sticky;top:0;padding:14px 16px calc(14px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:5;gap:8px;}
header h1{font-size:18px;margin:0;}
header .ctrls{display:flex;gap:6px;align-items:center;}
select,input,textarea{font-family:inherit;}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;}
nav button{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:20px;font-size:13px;cursor:pointer;}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
main{max-width:640px;margin:0 auto;padding:8px 16px 40px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;}
textarea{min-height:80px;resize:vertical;}
button.primary{background:var(--accent);color:#fff;border:none;padding:11px 16px;border-radius:9px;font-size:14px;cursor:pointer;margin-top:12px;width:100%;}
button.primary:disabled{opacity:.5;cursor:default;}
button.ghost{background:none;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;}
.plan{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.plan.current{border-color:var(--accent);}
.plan h3{margin:0 0 4px;}
.price{color:var(--accent);font-weight:600;}
.muted{color:var(--muted);font-size:13px;}
.result{white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px;font-size:14px;}
.timer{font-size:56px;text-align:center;margin:20px 0;font-variant-numeric:tabular-nums;}
.row{display:flex;gap:8px;}
.row button{flex:1;}
.flag{color:var(--danger);font-size:13px;margin-top:8px;}
</style>
</head>
<body>
<header>
  <h1>🧠 Ultron</h1>
  <div class="ctrls">
    <select id="langSel" onchange="setLang(this.value)"><option value="en">EN</option><option value="hi">हिं</option></select>
    <button class="ghost" id="themeBtn">🌓</button>
  </div>
</header>
<div id="app"></div>
<script>
const TIERS = {
  FREE:{chats:50, images:10, capacity:35, first:0, renew:0},
  BASIC:{chats:200, images:60, capacity:60, first:99, renew:199},
  PRO:{chats:Infinity, images:Infinity, capacity:100, first:299, renew:399}
};
const STR = {
  en:{helper:'AI Helper',pomodoro:'Pomodoro',plans:'Plans',logout:'Log out',ask:'Ask Ultron',mode:'Mode',
      doubt:'Ask a doubt',homework:'Homework assist',flash:'Flashcards from a syllabus photo'},
  hi:{helper:'एआई सहायक',pomodoro:'पोमोडोरो',plans:'योजनाएँ',logout:'लॉग आउट',ask:'Ultron से पूछें',mode:'मोड',
      doubt:'संदेह पूछें',homework:'होमवर्क सहायता',flash:'सिलेबस फोटो से फ्लैशकार्ड'}
};
function L(){ return localStorage.getItem('ultron_lang')||'en'; }
function setLang(l){ localStorage.setItem('ultron_lang', l); render(); }

function getUser(){ return JSON.parse(localStorage.getItem('ultron_user')||'null'); }
function getTier(){ return localStorage.getItem('ultron_tier')||'FREE'; }
function setTier(t){ localStorage.setItem('ultron_tier', t); }
function getUsage(){
  let u = JSON.parse(localStorage.getItem('ultron_usage')||'null');
  const m = new Date().getMonth();
  if(!u || u.month !== m){ u = {month:m, chats:0, images:0}; localStorage.setItem('ultron_usage', JSON.stringify(u)); }
  return u;
}
function saveUsage(u){ localStorage.setItem('ultron_usage', JSON.stringify(u)); }
function usageLine(){
  const t=getTier(), u=getUsage();
  const cl = TIERS[t].chats===Infinity?'∞':Math.max(0,TIERS[t].chats-u.chats);
  const il = TIERS[t].images===Infinity?'∞':Math.max(0,TIERS[t].images-u.images);
  return 'Plan: '+t+' · Chats left: '+cl+' · Images left: '+il;
}
function lockoutRemaining(){
  const end = parseInt(localStorage.getItem('ultron_lockout')||'0',10);
  return Math.max(0, Math.ceil((end-Date.now())/1000));
}
function setLockout(){ localStorage.setItem('ultron_lockout', String(Date.now()+5*60*1000)); }
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function val(id){ return document.getElementById(id).value.trim(); }

let view = getUser() ? 'helper' : 'signup';
function render(){
  const app = document.getElementById('app');
  document.getElementById('langSel').value = L();
  if(!getUser()){ app.innerHTML = viewSignup(); return; }
  if(view==='pomodoro') app.innerHTML = viewPomodoro();
  else if(view==='plans') app.innerHTML = viewPlans();
  else app.innerHTML = viewHelper();
}
function go(v){ view=v; render(); }
function logout(){ localStorage.removeItem('ultron_user'); view='signup'; render(); }

function shell(active, inner){
  const s = STR[L()];
  const tabs = [['helper',s.helper],['pomodoro',s.pomodoro],['plans',s.plans]];
  let nav = '<nav>' + tabs.map(([k,l])=>'<button class="'+(k===active?'active':'')+'" onclick="go(\''+k+'\')">'+l+'</button>').join('') +
    '<button onclick="logout()">'+s.logout+'</button></nav>';
  return nav + '<main>' + inner + '</main>';
}

function viewSignup(){
  return '<main><div class="card"><h2>Create your profile</h2>' +
    '<label>Full name</label><input id="f_name">' +
    '<label>Class</label><input id="f_class" placeholder="e.g. 10th">' +
    '<label>Section</label><input id="f_section" placeholder="e.g. A">' +
    '<label>School name</label><input id="f_school">' +
    '<label>Date of birth</label><input id="f_dob" type="date">' +
    '<label>Age</label><input id="f_age" type="number" min="5" max="25">' +
    '<label>Email</label><input id="f_email" type="email">' +
    '<button class="primary" onclick="submitSignup()">Get started</button></div></main>';
}
function submitSignup(){
  const u = {fullName:val('f_name'), schoolClass:val('f_class'), section:val('f_section'),
    schoolName:val('f_school'), dob:val('f_dob'), age:val('f_age'), email:val('f_email')};
  if(!u.fullName || !u.email){ alert('Please fill in your name and email.'); return; }
  localStorage.setItem('ultron_user', JSON.stringify(u));
  view='helper'; render();
}

let lockTicker = null;
function ensureLockTicker(){
  if(lockTicker) return;
  lockTicker = setInterval(()=>{
    if(view==='helper'){
      if(lockoutRemaining() > 0){ render(); } else { clearInterval(lockTicker); lockTicker=null; render(); }
    } else { clearInterval(lockTicker); lockTicker=null; }
  }, 1000);
}
function viewHelper(){
  const s = STR[L()];
  const lockSec = lockoutRemaining();
  if(lockSec>0) ensureLockTicker();
  return shell('helper',
    '<div class="card">' +
    '<div class="muted" id="h_usage">'+usageLine()+'</div>' +
    '<label>'+s.mode+'</label>' +
    '<select id="h_mode"><option value="doubt">'+s.doubt+'</option><option value="homework">'+s.homework+'</option><option value="flashcards">'+s.flash+'</option></select>' +
    '<label>Type your question (optional for homework/flashcards)</label>' +
    '<textarea id="h_text" placeholder="Type your doubt here..."></textarea>' +
    '<label>Or attach a photo</label>' +
    '<input type="file" id="h_file" accept="image/*">' +
    (lockSec>0 ? '<div class="flag">Doubts mode is locked for '+lockSec+'s due to flagged content.</div>' : '') +
    '<button class="primary" id="h_btn" onclick="askHelper()" '+(lockSec>0?'disabled':'')+'>'+s.ask+'</button>' +
    '<div id="h_result"></div></div>'
  );
}
function setResult(t){ document.getElementById('h_result').innerHTML = t ? ('<div class="result">'+escapeHtml(t)+'</div>') : ''; }

async function askHelper(){
  const mode = document.getElementById('h_mode').value;
  const text = document.getElementById('h_text').value.trim();
  const file = document.getElementById('h_file').files[0];
  const t = getTier(), u = getUsage();
  if(u.chats >= TIERS[t].chats){ setResult('You have used all your chats for this plan this month.'); return; }
  if(file && u.images >= TIERS[t].images){ setResult('You have used all your image submissions for this plan this month.'); return; }
  const btn = document.getElementById('h_btn');
  btn.disabled = true; setResult('Thinking...');
  try{
    const sample = await claude.use('sample');
    if(!sample){ setResult('AI features are not available in this view.'); btn.disabled=false; return; }
    let images = [];
    if(file){ const limits = await sample.limits(); if(limits.images) images = [file]; }
    if(mode==='doubt'){
      const data = await sample.json(
        'You are a friendly study tutor for a school student. The student asks: "'+(text||'(see attached image)')+
        '". If this is a genuine study doubt, answer it clearly for their level. If it asks for anything unsafe, ' +
        'explicit, or unrelated to studies that should not be answered, set flagged true and leave answer empty. ' +
        'Reply with ONLY JSON: {"flagged": boolean, "answer": string}',
        {images, modelTier:'quick'}
      );
      if(data.flagged){ setLockout(); render(); return; }
      setResult(data.answer);
    } else if(mode==='homework'){
      const r = await sample('You are a patient tutor. Solve this homework step by step so the student learns the method, not just the final answer:\n'+(text||'(see attached photo of the homework)'), {images});
      setResult(r.text);
    } else {
      const data = await sample.json(
        'From this syllabus/textbook content, generate 6 flashcard-style quiz questions with short answers, based on: '+
        (text||'(see attached photo)')+'. Reply with ONLY a JSON array of {"question":string,"answer":string}.', {images}
      );
      setResult(data.map((c,i)=>(i+1)+'. '+c.question+'\n   → '+c.answer).join('\n\n'));
    }
    u.chats++; if(file) u.images++; saveUsage(u);
    document.getElementById('h_usage').textContent = usageLine();
  }catch(e){
    setResult(e.code==='not_granted' ? 'Please allow Ultron to use Claude to enable this feature.' : 'Something went wrong ('+e.code+'). Try again.');
  }
  btn.disabled = false;
}

function viewPlans(){
  const t = getTier();
  const cards = Object.keys(TIERS).map(key=>{
    const p = TIERS[key];
    const price = p.first===0 ? 'Free' : ('₹'+p.first+' first month, then ₹'+p.renew+'/mo');
    const chats = p.chats===Infinity ? 'Unlimited' : p.chats;
    const imgs = p.images===Infinity ? 'Unlimited' : p.images;
    return '<div class="plan '+(key===t?'current':'')+'"><h3>'+key+(key===t?' (current)':'')+'</h3>' +
      '<div class="price">'+price+'</div>' +
      '<div class="muted">'+chats+' chats/mo · '+imgs+' images/mo · '+p.capacity+'% AI capacity</div>' +
      (key!==t ? '<button class="ghost" style="margin-top:8px" onclick="choosePlan(\''+key+'\')">'+(p.first===0?'Switch to Free':'Pay & switch')+'</button>' : '') +
      '</div>';
  }).join('');
  return shell('plans', '<div class="card"><h2>Plans</h2>'+cards+
    '<p class="muted">After paying, your plan is activated manually by the Ultron team — this can take a little while.</p></div>');
}
function choosePlan(key){
  const p = TIERS[key];
  if(p.first===0){ setTier('FREE'); render(); return; }
  const uri = 'upi://pay?pa=shreetulasi%40oksbi&pn=Ultron&tn=Ultron%20'+key+'%20subscription&am='+p.first+'&cu=INR';
  window.location.href = uri;
  alert('If your UPI app opened, complete the payment there. Your '+key+' plan will be activated once the team verifies it.');
}

let pomState = {phase:'Focus', secondsLeft:25*60, running:false, timerId:null, cycle:0};
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; }
function viewPomodoro(){
  return shell('pomodoro', '<div class="card"><h2 style="text-align:center">'+pomState.phase+'</h2>' +
    '<div class="timer" id="pomDisplay">'+fmt(pomState.secondsLeft)+'</div>' +
    '<div class="row"><button class="primary" onclick="pomToggle()">'+(pomState.running?'Pause':'Start')+'</button>' +
    '<button class="ghost" onclick="pomReset()">Reset</button></div></div>');
}
function pomToggle(){
  pomState.running = !pomState.running;
  if(pomState.running){
    pomState.timerId = setInterval(()=>{
      pomState.secondsLeft--;
      if(pomState.secondsLeft<=0){ pomAdvance(); }
      const d=document.getElementById('pomDisplay'); if(d) d.textContent=fmt(pomState.secondsLeft);
    },1000);
  } else { clearInterval(pomState.timerId); }
  render();
}
function pomAdvance(){
  if(pomState.phase==='Focus'){
    pomState.cycle++;
    pomState.phase = (pomState.cycle%4===0) ? 'Long Break' : 'Short Break';
    pomState.secondsLeft = (pomState.phase==='Long Break') ? 15*60 : 5*60;
  } else { pomState.phase='Focus'; pomState.secondsLeft=25*60; }
  render();
}
function pomReset(){ clearInterval(pomState.timerId); pomState={phase:'Focus',secondsLeft:25*60,running:false,timerId:null,cycle:0}; render(); }

(function(){ const saved=localStorage.getItem('ultron_theme'); if(saved) document.documentElement.setAttribute('data-theme', saved); })();
document.getElementById('themeBtn').onclick = () => {
  const html=document.documentElement;
  const next = html.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('ultron_theme', next);
};
render();
</script>
</body>
</html>
