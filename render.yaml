# Deploy the FastAPI backend separately from GitHub Pages.
# After creating the service, set the frontend API base URL in index.html to
# the generated https://<service>.onrender.com URL.
# The free PostgreSQL plan is for evaluation and expires after its trial period;
# upgrade it before relying on this service for real student accounts or payments.
databases:
  - name: ultron-db
    databaseName: ultron
    user: ultron
    plan: free
services:
  - type: web
    name: ultron-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ultron-db
          property: connectionString
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: ALLOWED_ORIGINS
        value: https://manaskakkunuri.github.io,http://127.0.0.1:8765,http://localhost:8765
      - key: UPI_ID
        value: shreetulasi@oksbi
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-nano-banana-2.1
      - key: PAYMENT_RECONCILIATION_SECRET
        sync: false
