# Deploy the FastAPI backend separately from GitHub Pages.
# After creating the service, set the frontend API base URL in index.html to
# the generated https://<service>.onrender.com URL.
services:
  - type: web
    name: ultron-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./ultron.db
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: ALLOWED_ORIGINS
        value: https://manaskakkunuri.github.io
      - key: UPI_ID
        value: shreetulasi@oksbi
      - key: TINYFISH_API_KEY
        sync: false
      - key: TINYFISH_SEARCH_URL
        value: https://api.search.tinyfish.ai
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-nano-banana-2.1
      - key: PAYMENT_RECONCILIATION_SECRET
        sync: false
